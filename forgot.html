<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 비밀번호 찾기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/page-v2.css" />
<style>
.auth-input {
  width: 100%;
  background: #F7F9F7;
  border: 1.5px solid #E8ECEC;
  border-radius: 10px;
  padding: 13px 14px;
  font-size: 15px;
  color: #1A2B1F;
  outline: none;
  font-family: inherit;
  transition: border-color 0.18s;
}
.auth-input:focus { border-color: #3F7A4D; background: #fff; }
.auth-input::placeholder { color: #B0BBB5; }
.auth-field-label {
  font-size: 12px;
  font-weight: 700;
  color: #8A9C90;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.auth-submit {
  width: 100%;
  background: #2A6F40;
  color: #fff;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: 700;
  transition: opacity 0.15s;
  font-family: inherit;
}
.auth-submit:active { opacity: 0.85; }
.auth-submit:disabled { opacity: 0.55; }
.auth-alert {
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}
.auth-alert.error { background: #FDEAEA; color: #C0392B; }
.auth-alert.info  { background: #EAF4EE; color: #2A6F40; }
</style>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-nav">
      <a class="pv2-icon-btn" href="login.html" aria-label="뒤로">
        <span class="material-symbols-rounded">arrow_back_ios_new</span>
      </a>
      <div class="pv2-nav-title">비밀번호 찾기</div>
    </div>
  </header>

  <main class="scroll">

    <div style="padding:24px 0 20px;">
      <div style="width:56px;height:56px;border-radius:16px;background:#EAF4EE;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
        <span class="material-symbols-rounded" style="font-size:28px;color:#2A6F40;">lock_reset</span>
      </div>
      <div style="font-size:22px;font-weight:800;color:#1A2B1F;letter-spacing:-0.04em;line-height:1.35;">비밀번호를<br>잊으셨나요?</div>
      <div style="font-size:14px;color:#6B7C71;margin-top:10px;line-height:1.7;">가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드려요.</div>
    </div>

    <div style="background:#fff;border-radius:14px;border:1px solid #ECEEF0;padding:20px;display:flex;flex-direction:column;gap:14px;">
      <div>
        <div class="auth-field-label">이메일</div>
        <input class="auth-input" id="fg-email" type="email" placeholder="가입하신 이메일 주소" autocomplete="email" />
      </div>
      <div class="auth-alert error" id="fg-error" style="display:none;"></div>
      <div class="auth-alert info"  id="fg-info"  style="display:none;"></div>
      <button class="auth-submit" id="fg-submit" type="button">재설정 링크 보내기</button>
    </div>

    <div style="text-align:center;margin-top:20px;">
      <a href="login.html" style="font-size:13px;color:#6B7C71;font-weight:600;">← 로그인으로 돌아가기</a>
    </div>

  </main>
</div>

<script type="module" src="js/forgot.js"></script>
</body>
</html>
