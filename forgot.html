<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 비밀번호 찾기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div class="status-bar"><span>9:41</span>
    <span class="status-icons"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span>
  </div>

  <header class="sub-header">
    <a class="icon-btn" href="login.html" aria-label="뒤로"><span class="material-symbols-rounded">arrow_back_ios_new</span></a>
    <div class="title">비밀번호 찾기</div>
    <span style="width:44px"></span>
  </header>

  <main class="scroll">
    <div class="section" data-rise>
      <h2 style="font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.4">비밀번호를<br>잊으셨나요?</h2>
      <p style="font-size:13px;color:var(--color-text-sub);line-height:1.7;margin-top:10px;font-weight:300">
        가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드려요.
      </p>
      <div style="width:60px;height:60px;border-radius:20px;background:var(--color-primary-soft);display:flex;align-items:center;justify-content:center;margin-top:20px">
        <span class="material-symbols-rounded" style="font-size:30px;color:var(--color-primary)">lock_reset</span>
      </div>
    </div>

    <div class="section" data-rise>
      <div class="card">
        <div class="form">
          <div class="form-group">
            <span class="form-label">이메일</span>
            <input class="input" id="fg-email" type="email" placeholder="가입하신 이메일 주소" autocomplete="email" />
          </div>
        </div>
      </div>
    </div>

    <div class="alert alert-info" id="fg-info" style="display:none;margin:0 var(--space-page)"></div>
    <div class="alert alert-error" id="fg-error" style="display:none;margin:0 var(--space-page)"></div>

    <div class="section" data-rise>
      <button class="btn btn-primary btn-block" id="fg-submit" type="button" style="padding:15px">재설정 링크 보내기</button>
      <div style="text-align:center;margin-top:14px">
        <a href="login.html" style="font-size:13px;color:var(--color-text-sub);font-weight:600">← 로그인으로 돌아가기</a>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/forgot.js"></script>
</body>
</html>
