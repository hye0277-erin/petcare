<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 병원 기록 추가</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<script src="js/font-loader.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/picker.css?v=2" />
<link rel="stylesheet" href="css/page-v2.css?v=2" />
<link rel="stylesheet" href="css/hospital.css?v=2" />
<script type="module" src="js/guard.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-nav">
      <button class="pv2-icon-btn" id="btn-back" aria-label="뒤로 가기">
        <span class="material-symbols-rounded">arrow_back_ios_new</span>
      </button>
      <div class="pv2-nav-title" id="page-title">병원 기록 추가</div>
    </div>
    <div class="pv2-header-actions">
      <button class="hosp-text-btn" id="btn-draft">임시 저장</button>
    </div>
  </header>

  <main class="scroll hosp-form-scroll">

    <!-- A. 방문 정보 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">방문 정보</div>

      <div class="form-group">
        <span class="form-label">방문 날짜 <span class="form-required">필수</span></span>
        <input class="input" id="f-date" data-picker="date" data-picker-placeholder="날짜를 선택하세요" />
      </div>

      <div class="form-group">
        <div class="hosp-label-row">
          <span class="form-label">방문 시간</span>
          <button class="hosp-clear-btn" id="btn-clear-time" type="button">시간 지우기</button>
        </div>
        <input class="input" id="f-time" data-picker="time" data-picker-placeholder="시간을 선택하세요" />
      </div>

      <div class="form-group">
        <span class="form-label">병원 <span class="form-required">필수</span></span>
        <input class="input" id="f-hospital" type="text" placeholder="병원명을 입력하세요" />
      </div>

      <div class="form-group">
              <span class="form-label">담당 수의사</span>
        <input class="input" id="f-doctor" type="text" placeholder="예: 김하늘 수의사" />
      </div>

      <div class="form-group">
        <span class="form-label">방문 목적 <span class="form-required">필수</span></span>
        <div class="hosp-chip-group" id="purpose-chips">
          <button class="hosp-chip" data-val="정기검진">정기검진</button>
          <button class="hosp-chip" data-val="재검">재검</button>
          <button class="hosp-chip" data-val="증상 진료">증상 진료</button>
          <button class="hosp-chip" data-val="처방 상담">처방 상담</button>
          <button class="hosp-chip" data-val="예방접종">예방접종</button>
          <button class="hosp-chip" data-val="응급진료">응급진료</button>
          <button class="hosp-chip" data-val="기타">기타</button>
        </div>
        <input class="input hosp-other-input" id="f-purpose-other" type="text" placeholder="방문 목적을 직접 입력해 주세요" />
      </div>
    </div>

    <!-- B. 진료 내용 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">진료 내용</div>

      <div class="form-group">
              <span class="form-label">진료 내용</span>
        <textarea class="textarea hosp-textarea-sm" id="f-content" placeholder="이번 방문에서 진행한 진료나 검사를 적어주세요."></textarea>
      </div>

      <div class="form-group">
              <span class="form-label">수의사 설명</span>
        <textarea class="textarea hosp-textarea-sm" id="f-vet-notes" placeholder="병원에서 들은 설명을 기록해 두세요."></textarea>
      </div>

      <div class="form-group">
              <span class="form-label">진단 / 소견</span>
        <input class="input" id="f-diagnosis" type="text" placeholder="진단명 또는 소견을 자유롭게 입력" />
      </div>
    </div>

    <!-- C. 처방 및 변경사항 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">처방 및 변경사항</div>

      <div class="form-group">
        <span class="form-label">처방 약물 <span class="form-opt">한 줄에 하나씩</span></span>
        <textarea class="textarea hosp-textarea-md" id="f-rx" placeholder="예: 심장약 1일 1회 · 아침&#10;신장 보조제 1일 2회 · 1/2알"></textarea>
      </div>

      <label class="choice hosp-choice-row">
        <input type="checkbox" id="f-make-routine" /> 처방 약물로 복약 일정 만들기
      </label>
    </div>

    <!-- D. 검사 자료 첨부 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">검사 자료</div>
      <p class="hosp-section-desc">검사 결과지, 처방전, 영수증, 진료 안내문 등을 첨부할 수 있어요.</p>

      <div id="attachment-list"></div>

      <button class="hosp-attach-btn" id="btn-attach">
        <span class="material-symbols-rounded">upload_file</span>
        파일 첨부
      </button>
      <input type="file" id="attach-input" accept="application/pdf,image/png,image/jpeg" class="hosp-hidden-input" />
    </div>

    <!-- E. 다음 진료 일정 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">다음 진료 일정</div>

      <div class="form-group">
              <span class="form-label">다음 진료일</span>
        <input class="input" id="f-next-date" data-picker="date" data-picker-placeholder="날짜를 선택하세요" />
      </div>

      <div class="form-group" id="next-time-group">
              <span class="form-label">다음 진료 시간</span>
        <input class="input" id="f-next-time" data-picker="time" data-picker-placeholder="시간을 선택하세요" />
      </div>

      <div class="form-group">
              <span class="form-label">준비 메모</span>
        <input class="input" id="f-next-memo" type="text" placeholder="예: 8시간 금식, 소변 샘플 준비" />
      </div>
    </div>

    <!-- F. 보호자 메모 -->
    <div class="hosp-form-section">
      <div class="hosp-form-section-title">보호자 메모</div>

      <div class="form-group">
        <textarea class="textarea hosp-textarea-sm" id="f-memo" placeholder="다음 진료 때 확인할 내용을 적어두세요."></textarea>
      </div>
    </div>

  </main>

  <!-- 하단 고정 버튼 -->
  <div class="hosp-bottom-bar">
    <button class="btn btn-ghost hosp-cancel-btn" id="btn-cancel">취소</button>
    <button class="btn btn-primary btn-block" id="btn-save">저장</button>
  </div>

  <!-- 첨부 자료 정보 모달 -->
  <div class="sheet-overlay" id="attach-sheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="attach-sheet-title">첨부 자료 정보</div>
      <div class="form">
        <div class="form-group">
          <span class="form-label">자료 제목 <span class="form-required">필수</span></span>
          <input class="input" id="at-title" type="text" placeholder="예: 2026년 6월 신장 혈액검사" />
          <div class="form-hint">목록에서 바로 알아볼 수 있는 제목을 입력해 주세요.</div>
        </div>
        <div class="form-group">
          <span class="form-label">자료 종류 <span class="form-required">필수</span></span>
          <div class="hosp-chip-group" id="attach-kind-chips">
            <button class="hosp-chip" data-val="혈액검사">혈액검사</button>
            <button class="hosp-chip" data-val="소변검사">소변검사</button>
            <button class="hosp-chip" data-val="엑스레이">엑스레이</button>
            <button class="hosp-chip" data-val="초음파">초음파</button>
            <button class="hosp-chip" data-val="처방전">처방전</button>
            <button class="hosp-chip" data-val="영수증">영수증</button>
            <button class="hosp-chip" data-val="진료 안내문">진료 안내문</button>
            <button class="hosp-chip" data-val="기타">기타</button>
          </div>
        </div>
        <div class="form-group">
            <span class="form-label">검사 날짜</span>
          <input class="input" id="at-date" data-picker="date" data-picker-placeholder="날짜를 선택하세요" />
        </div>
        <div class="form-group">
            <span class="form-label">설명</span>
          <input class="input" id="at-memo" type="text" placeholder="간단한 설명을 입력하세요" />
        </div>
        <div class="hosp-sheet-btns">
          <button class="btn btn-ghost hosp-sheet-close-btn" type="button" id="at-cancel">취소</button>
          <button class="btn btn-primary btn-block" type="button" id="at-save">첨부 완료</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 이미지 미리보기 모달 -->
  <div id="img-preview-modal" class="hosp-img-modal" onclick="if(event.target===this)this.style.display='none'">
    <img id="img-preview-img" src="" alt="미리보기" class="hosp-img-preview" />
  </div>

</div>
<script src="js/store.js?v=2"></script>
<script src="js/picker.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/hospital-add.js?v=1"></script>
</body>
</html>
