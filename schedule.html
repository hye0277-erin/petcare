<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 일정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<script type="module" src="js/guard.js"></script>
</head>
<body>
<div class="app">

  <div class="status-bar">
    <span>9:41</span>
    <span class="status-icons">
      <span class="material-symbols-rounded">signal_cellular_alt</span>
      <span class="material-symbols-rounded">wifi</span>
      <span class="material-symbols-rounded">battery_full</span>
    </span>
  </div>

  <!-- Header -->
  <header class="header" data-rise>
    <div class="header-row">
      <h1 class="page-title">일정</h1>
      <a class="icon-btn solid" href="schedule-add.html" aria-label="일정 추가">
        <span class="material-symbols-rounded">add</span>
      </a>
    </div>
  </header>

  <main class="scroll">
    <!-- 오늘 요약 + 루틴 관리 진입 -->
    <section class="section" data-rise>
      <div class="sched-today" id="sched-today"></div>
      <a class="routine-entry" href="routines.html">
        <span class="re-ic"><span class="material-symbols-rounded">repeat</span></span>
        <span class="re-body"><span class="re-title">반복 루틴 관리</span><span class="re-desc">매일·매주 반복되는 케어 규칙 설정</span></span>
        <span class="material-symbols-rounded" style="color:var(--color-text-light)">chevron_right</span>
      </a>
    </section>

    <!-- 선택한 날짜의 일정/기록 -->
    <section class="section" data-rise>
      <h2 class="day-title" id="day-title">오늘의 일정 <span class="today-pill">6월 13일</span></h2>
      <div class="card timeline-card" id="day-list"></div>
      <div id="day-records"></div>
    </section>

    <!-- Calendar (보조) -->
    <div class="card-label" data-rise>캘린더</div>
    <section class="card calendar" data-rise>
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="이전 달"><span class="material-symbols-rounded">chevron_left</span></button>
        <div class="month" id="cal-month">2026년 6월</div>
        <button class="cal-nav" id="cal-next" aria-label="다음 달"><span class="material-symbols-rounded">chevron_right</span></button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span><i class="pip green"></i> 완료</span>
        <span><i class="pip orange"></i> 일정</span>
        <span><i class="pip blue"></i> 기록</span>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab" href="index.html"><span class="material-symbols-rounded">home</span><span>홈</span></a>
    <a class="tab" href="record.html"><span class="material-symbols-rounded">edit_note</span><span>기록</span></a>
    <a class="tab" href="hospital.html"><span class="material-symbols-rounded">local_hospital</span><span>병원</span></a>
    <a class="tab" href="report.html"><span class="material-symbols-rounded">bar_chart</span><span>리포트</span></a>
    <a class="tab" href="settings.html"><span class="material-symbols-rounded">settings</span><span>설정</span></a>
  </nav>
  <div class="home-indicator"><i></i></div>

</div>
<script src="js/store.js"></script>
<script src="js/schedule.js"></script>
<script src="js/main.js"></script>
</body>
</html>
