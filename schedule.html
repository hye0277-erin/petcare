<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 일정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<script src="js/font-loader.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/page-v2.css?v=2" />
<script type="module" src="js/guard.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-left">
      <div class="pv2-title">일정</div>
    </div>
    <div class="pv2-header-actions">
      <a class="pv2-icon-btn" href="schedule-add.html" aria-label="일정 추가">
        <span class="material-symbols-rounded">add</span>
      </a>
    </div>
  </header>

  <main class="scroll">

    <!-- 오늘 요약 + 루틴 관리 -->
    <section class="section" data-rise>
      <div class="sched-today" id="sched-today"></div>
      <a class="routine-entry" href="routines.html">
        <span class="re-ic"><span class="material-symbols-rounded">repeat</span></span>
        <span class="re-body"><span class="re-title">반복 루틴 관리</span><span class="re-desc">매일·매주 반복되는 케어 규칙 설정</span></span>
        <span class="material-symbols-rounded" style="color:var(--color-text-light)">chevron_right</span>
      </a>
    </section>

    <!-- 주간 날짜 카드 -->
    <section class="section" data-rise>
      <div class="week-bar-head">
        <span class="week-bar-month" id="week-bar-month"></span>
        <button class="week-bar-all" id="btn-cal-toggle" aria-expanded="false">
          전체 보기<span class="material-symbols-rounded">expand_more</span>
        </button>
      </div>
      <div class="week-bar" id="week-bar"></div>

      <!-- 월간 캘린더 (접힌 상태) -->
      <div class="full-cal-wrap" id="full-cal-wrap" aria-hidden="true">
        <div class="card calendar" style="margin-top:10px">
          <div class="cal-head">
            <button class="cal-nav" id="cal-prev" aria-label="이전 달"><span class="material-symbols-rounded">chevron_left</span></button>
            <div class="month" id="cal-month"></div>
            <button class="cal-nav" id="cal-next" aria-label="다음 달"><span class="material-symbols-rounded">chevron_right</span></button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-legend">
            <span><i class="pip green"></i> 완료</span>
            <span><i class="pip orange"></i> 일정</span>
            <span><i class="pip blue"></i> 기록</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 선택 날짜 일정/기록 -->
    <section class="section" data-rise id="day-section">
      <h2 class="day-title" id="day-title"></h2>
      <div id="day-list"></div>
      <div id="day-records"></div>
    </section>

  </main>

  <nav class="pv2-tabbar">
    <a class="pv2-tab" href="index.html"><span class="material-symbols-rounded">home</span><span>홈</span></a>
    <a class="pv2-tab" href="record.html"><span class="material-symbols-rounded">edit_note</span><span>기록</span></a>
    <a class="pv2-tab" href="hospital.html"><span class="material-symbols-rounded">local_hospital</span><span>병원</span></a>
    <a class="pv2-tab" href="report.html"><span class="material-symbols-rounded">bar_chart</span><span>리포트</span></a>
    <a class="pv2-tab" href="settings.html"><span class="material-symbols-rounded">settings</span><span>설정</span></a>
  </nav>
  <div class="home-indicator"><i></i></div>

</div>
<script src="js/store.js?v=2"></script>
<script src="js/schedule.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/alarm.js?v=2"></script>
</body>
</html>
