<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 로그인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">

  <div class="status-bar">
    <span>9:41</span>
    <span class="status-icons">
      <span class="material-symbols-rounded">signal_cellular_alt</span>
      <span class="material-symbols-rounded">wifi</span>
      <span class="material-symbols-rounded">battery_full</span>
    </span>
  </div>

  <main class="scroll">
    <div class="auth-hero" data-rise>
      <div class="auth-logo">🐶</div>
      <div class="auth-title">PetCare+</div>
      <div class="auth-sub">반려동물 건강 케어를 시작해요</div>
    </div>

    <!-- 로그인 / 회원가입 토글 -->
    <div class="segment" data-rise>
      <button type="button" id="tab-login" class="active" data-mode="login">로그인</button>
      <button type="button" id="tab-signup" data-mode="signup">회원가입</button>
    </div>

    <div class="section" data-rise>
      <div class="card">
        <div class="form">
          <div class="form-group">
            <span class="form-label">이메일</span>
            <input class="input" type="email" id="auth-email" placeholder="example@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <span class="form-label">비밀번호</span>
            <input class="input" type="password" id="auth-password" placeholder="6자 이상" autocomplete="current-password" />
          </div>

          <div class="alert alert-error" id="auth-error" style="display:none"></div>
          <div class="alert alert-info" id="auth-info" style="display:none"></div>

          <button class="btn btn-primary btn-block" type="button" id="auth-submit">로그인</button>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
            <a href="signup.html" style="font-size:12px;color:var(--color-text-sub);font-weight:600">이메일로 회원가입</a>
            <a href="forgot.html" style="font-size:12px;color:var(--color-primary);font-weight:600">비밀번호 찾기</a>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="js/store.js"></script>
<script type="module">
  import { signUp, signIn, getUser } from './js/auth.js';

  // 반려견 정보 유무에 따라 진입 화면 결정
  const afterAuth = () =>
    (window.PetStore && window.PetStore.hasPet()) ? 'index.html' : 'register.html';

  const $ = (id) => document.getElementById(id);
  const emailEl  = $('auth-email');
  const pwEl     = $('auth-password');
  const errEl    = $('auth-error');
  const infoEl   = $('auth-info');
  const submitEl = $('auth-submit');
  let mode = 'login';

  getUser().then((user) => { if (user) location.replace(afterAuth()); }).catch(() => {});

  function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; infoEl.style.display = 'none'; }
  function showInfo(msg)  { infoEl.textContent = msg; infoEl.style.display = 'block'; errEl.style.display = 'none'; }
  function clearMsg()     { errEl.style.display = 'none'; infoEl.style.display = 'none'; }

  function setMode(next) {
    mode = next;
    $('tab-login').classList.toggle('active', mode === 'login');
    $('tab-signup').classList.toggle('active', mode === 'signup');
    submitEl.textContent = mode === 'login' ? '로그인' : '회원가입';
    pwEl.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
    clearMsg();
  }
  $('tab-login').addEventListener('click', () => setMode('login'));
  $('tab-signup').addEventListener('click', () => setMode('signup'));

  async function handleSubmit() {
    clearMsg();
    const email = emailEl.value.trim();
    const password = pwEl.value;
    if (!email || !password) { showError('이메일과 비밀번호를 입력해 주세요.'); return; }

    submitEl.disabled = true;
    submitEl.textContent = '처리 중...';

    if (mode === 'login') {
      const res = await signIn(email, password);
      if (res.ok) { location.replace(afterAuth()); return; }
      showError(res.message);
    } else {
      const res = await signUp(email, password);
      if (res.ok && res.needConfirm) {
        showInfo('가입 확인 메일을 보냈어요. 메일 인증 후 로그인해 주세요.');
        setMode('login');
      } else if (res.ok) {
        // 인증 완료 후 첫 로그인 → 반려견 등록
        location.replace('register.html');
        return;
      } else {
        showError(res.message);
      }
    }
    submitEl.disabled = false;
    submitEl.textContent = mode === 'login' ? '로그인' : '회원가입';
  }

  submitEl.addEventListener('click', handleSubmit);
  pwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSubmit(); });
</script>
</body>
</html>
