<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 시작하기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/onboarding.css" />
</head>
<body>
<div class="app">
  <div class="status-bar"><span>9:41</span>
    <span class="status-icons"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span>
  </div>

  <!-- 스플래시 -->
  <div class="splash" id="splash">
    <div class="splash-paw">🐾</div>
    <div class="splash-name">PetCare<sup>+</sup></div>
    <div class="splash-tag">반려동물 케어의 모든 것</div>
  </div>

  <!-- 온보딩 슬라이드 -->
  <div class="ob" id="ob">
    <div class="ob-illus">
      <div class="ob-illus-bg" id="ob-bg" style="background:linear-gradient(160deg,var(--color-primary-soft),#FDF0E4)"></div>
      <div class="ob-emoji" id="ob-emoji">🐶</div>
    </div>
    <div class="ob-dots">
      <div class="ob-dot on" data-dot="0"></div>
      <div class="ob-dot" data-dot="1"></div>
      <div class="ob-dot" data-dot="2"></div>
    </div>
    <div class="ob-text">
      <div class="ob-badge" id="ob-badge">CARE</div>
      <div class="ob-h" id="ob-h">매일의 케어를<br>빠짐없이 기록해요</div>
      <div class="ob-p" id="ob-p">복약·식사·산책 같은 반복 케어를 일정으로 등록하고,<br>홈에서 체크만 하면 자동으로 기록이 쌓여요.</div>
    </div>
    <div class="ob-actions">
      <button class="btn btn-primary btn-block" id="ob-next">다음</button>
      <div class="ob-skip" id="ob-skip">건너뛰기</div>
    </div>
  </div>
</div>

<script src="js/onboarding.js"></script>
</body>
</html>
