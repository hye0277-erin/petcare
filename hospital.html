<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 병원 기록</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<script src="js/font-loader.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/picker.css?v=2" />
<link rel="stylesheet" href="css/page-v2.css?v=2" />
<link rel="stylesheet" href="css/hospital.css?v=2" />
<script type="module" src="js/guard.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-left">
      <div class="pv2-title">병원 기록</div>
      <div class="pv2-subtitle" data-pet-sub>해피의 진료 기록을 모아봤어요.</div>
    </div>
    <div class="pv2-header-actions">
      <button class="pv2-icon-btn" id="btn-search" aria-label="검색">
        <span class="material-symbols-rounded">search</span>
      </button>
      <button class="pv2-icon-btn" id="btn-add" aria-label="병원 기록 추가">
        <span class="material-symbols-rounded">note_add</span>
      </button>
    </div>
  </header>

  <!-- 검색 바 (숨김) -->
  <div id="search-bar" class="hosp-search-bar">
    <div class="hosp-search-inner">
      <span class="material-symbols-rounded hosp-search-ic">search</span>
      <input id="search-input" type="text" placeholder="병원명, 진료 내용 검색" class="hosp-search-input" />
      <button id="btn-search-close" class="hosp-search-close"><span class="material-symbols-rounded">close</span></button>
    </div>
  </div>

  <main class="scroll">

    <!-- 임시 저장 카드 -->
    <div id="draft-card" class="hosp-draft-wrap"></div>

    <!-- 다음 진료 카드 -->
    <div id="next-visit-card" data-rise></div>

    <!-- 최근 방문 기록 -->
    <div class="hosp-section-head">
      <span class="hosp-section-title">최근 방문 기록</span>
      <button class="hosp-text-btn" id="btn-all-visits">전체 보기</button>
    </div>
    <div id="visit-list" data-rise class="hosp-list-wrap"></div>

    <!-- 최근 검사 자료 -->
    <div class="hosp-section-head">
      <span class="hosp-section-title">검사 자료</span>
      <button class="hosp-text-btn" id="btn-all-tests">전체 보기</button>
    </div>
    <div id="test-list" data-rise class="hosp-list-wrap"></div>

    <!-- 처방 내역 -->
    <div class="hosp-section-head">
      <span class="hosp-section-title">처방 내역</span>
    </div>
    <div id="rx-list" data-rise class="hosp-list-wrap"></div>

    <button class="add-dashed" id="btn-add-bottom">
      <span class="material-symbols-rounded">add</span>병원 기록 추가
    </button>
    <div class="hosp-page-bottom"></div>
  </main>

  <nav class="pv2-tabbar">
    <a class="pv2-tab" href="index.html"><span class="material-symbols-rounded">home</span><span>홈</span></a>
    <a class="pv2-tab" href="record.html"><span class="material-symbols-rounded">edit_note</span><span>기록</span></a>
    <a class="pv2-tab active" href="hospital.html"><span class="material-symbols-rounded">local_hospital</span><span>병원</span></a>
    <a class="pv2-tab" href="report.html"><span class="material-symbols-rounded">bar_chart</span><span>리포트</span></a>
    <a class="pv2-tab" href="settings.html"><span class="material-symbols-rounded">settings</span><span>설정</span></a>
  </nav>

  <!-- 검사 결과 상세 시트 -->
  <div class="sheet-overlay" id="test-sheet">
    <div class="sheet hosp-test-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="t-title">검사 자료</div>
      <div id="t-body"></div>
      <div class="hosp-sheet-btns">
        <button class="btn btn-ghost hosp-sheet-close-btn" type="button" data-h-close>닫기</button>
        <button class="btn btn-primary btn-block" type="button" id="t-share">공유 준비하기</button>
      </div>
      <div class="hosp-sheet-del-wrap">
        <button class="btn btn-block hosp-del-btn" type="button" id="t-delete">
          <span class="material-symbols-rounded hosp-del-ic">delete</span> 이 기록 삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 처방 수정 시트 -->
  <div class="sheet-overlay" id="rx-sheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">처방 수정</div>
      <div class="form">
        <div class="form-group">
          <span class="form-label">처방 내용</span>
          <input class="input" id="rx-edit-input" type="text" placeholder="예: 심장약 1일 1회 · 아침" />
        </div>
        <div class="hosp-sheet-btns">
          <button class="btn btn-ghost hosp-sheet-close-btn" type="button" id="rx-edit-cancel">취소</button>
          <button class="btn btn-primary btn-block" type="button" id="rx-edit-save">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 첨부파일 교체/추가용 hidden input -->
  <input type="file" id="test-file-replace-input" accept="application/pdf,image/png,image/jpeg" class="hosp-hidden-input" />

  <!-- 이미지 미리보기 모달 -->
  <div id="img-preview-modal" class="hosp-img-modal" onclick="if(event.target===this)this.style.display='none'">
    <img id="img-preview-img" src="" alt="미리보기" class="hosp-img-preview" />
    <div class="hosp-img-modal-btns">
      <button onclick="document.getElementById('img-preview-modal').style.display='none'" class="hosp-img-btn">닫기</button>
      <button id="img-preview-dl" class="hosp-img-btn primary">다운로드</button>
    </div>
  </div>

</div>
<script src="js/store.js?v=2"></script>
<script src="js/picker.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/hospital.js?v=3"></script>
</body>
</html>
