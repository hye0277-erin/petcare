<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 반려견 등록</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<script src="js/font-loader.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/picker.css?v=2" />
<link rel="stylesheet" href="css/page-v2.css?v=2" />
<script type="module" src="js/guard.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-nav">
      <a class="pv2-icon-btn" href="settings.html" aria-label="뒤로">
        <span class="material-symbols-rounded">arrow_back_ios_new</span>
      </a>
      <div class="pv2-nav-title" id="reg-title">반려견 등록</div>
    </div>
  </header>

  <main class="scroll">
    <div class="pv2-card-label" data-rise>기본 정보</div>
    <div class="card" data-rise>
      <div class="form">
        <div class="form-group">
          <span class="form-label">반려견 이름</span>
          <input class="input" id="r-name" type="text" placeholder="해피" />
        </div>
        <div class="form-group">
          <span class="form-label">사진 <span style="font-weight:500;color:var(--color-text-light)">선택</span></span>
          <div class="photo-pick">
            <div class="photo-preview" id="r-photo-preview" aria-hidden="true">🐶</div>
            <div class="photo-pick-body">
              <input class="input" id="r-photo" type="file" accept="image/png,image/jpeg,image/*" />
              <button type="button" class="photo-clear" id="r-photo-clear" style="display:none">사진 삭제</button>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="form-group">
            <span class="form-label">생년월일</span>
            <input class="input" id="r-birth" data-picker="date" data-picker-placeholder="생년월일" />
          </div>
          <div class="form-group">
            <span class="form-label">나이</span>
            <input class="input" id="r-age" type="number" min="0" placeholder="살" />
          </div>
        </div>
        <div class="field-row">
          <div class="form-group">
            <span class="form-label">현재 체중 (kg)</span>
            <input class="input" id="r-weight" type="number" min="0" step="0.1" placeholder="예: 3.8" />
          </div>
          <div class="form-group">
            <span class="form-label">다음 진료일 <span style="font-weight:500;color:var(--color-text-light)">선택</span></span>
            <input class="input" id="r-next" data-picker="date" data-picker-placeholder="선택 안 함" />
          </div>
        </div>
        <div class="form-group">
          <span class="form-label">성별</span>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="gender" value="수컷" checked /> 수컷</label>
            <label class="choice"><input type="radio" name="gender" value="암컷" /> 암컷</label>
          </div>
        </div>
        <div class="form-group">
          <span class="form-label">견종</span>
          <input class="input" id="r-breed" type="text" placeholder="말티즈" />
        </div>
      </div>
    </div>

    <div class="pv2-card-label" data-rise>건강 메모 <span style="font-weight:500;color:var(--color-text-light)">선택</span></div>
    <div class="card" data-rise>
      <div class="form">
        <div class="form-group">
          <span class="form-label">주요 병력</span>
          <input class="input" id="r-history" type="text" placeholder="예: 2023년 심장질환 진단" />
        </div>
        <div class="form-group">
          <span class="form-label">복용 중인 약</span>
          <input class="input" id="r-meds" type="text" placeholder="예: 심장약, 신장 보조제" />
        </div>
        <div class="form-group">
          <span class="form-label">주의사항</span>
          <input class="input" id="r-caution" type="text" placeholder="예: 과한 운동 주의" />
        </div>
      </div>
    </div>

    <div class="pv2-card-label" data-rise>건강 태그 <span style="font-weight:500;color:var(--color-text-light)">선택</span></div>
    <div class="card" data-rise>
      <div class="choice-grid" id="r-tags">
        <label class="choice"><input type="checkbox" value="심장질환" /> 심장질환</label>
        <label class="choice"><input type="checkbox" value="신장관리" /> 신장관리</label>
        <label class="choice"><input type="checkbox" value="췌장염" /> 췌장염</label>
        <label class="choice"><input type="checkbox" value="당뇨" /> 당뇨</label>
        <label class="choice"><input type="checkbox" value="관절" /> 관절</label>
        <label class="choice"><input type="checkbox" value="종양" /> 종양</label>
      </div>
      <div class="form-group" style="margin-top:14px">
        <span class="form-label">기타</span>
        <input class="input" id="r-tag-etc" type="text" placeholder="직접 입력" />
      </div>
    </div>

    <div class="section" data-rise>
      <button class="btn btn-primary btn-block" id="r-submit" type="button">등록 완료</button>
    </div>
  </main>

  <nav class="pv2-tabbar">
    <a class="pv2-tab" href="index.html"><span class="material-symbols-rounded">home</span><span>홈</span></a>
    <a class="pv2-tab" href="record.html"><span class="material-symbols-rounded">edit_note</span><span>기록</span></a>
    <a class="pv2-tab" href="hospital.html"><span class="material-symbols-rounded">local_hospital</span><span>병원</span></a>
    <a class="pv2-tab" href="report.html"><span class="material-symbols-rounded">bar_chart</span><span>리포트</span></a>
    <a class="pv2-tab active" href="settings.html"><span class="material-symbols-rounded">settings</span><span>설정</span></a>
  </nav>
  <div class="home-indicator"><i></i></div>

  <div class="sheet-overlay" data-sheet>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">무엇을 기록할까요?</div>
      <div class="sheet-grid">
        <a class="quick-btn" href="record.html?type=symptom"><span class="quick-ic ic-blue"><span class="material-symbols-rounded">stethoscope</span></span><span>증상</span></a>
        <a class="quick-btn" href="record.html?type=meal"><span class="quick-ic ic-green"><span class="material-symbols-rounded">restaurant</span></span><span>식사</span></a>
        <a class="quick-btn" href="record.html?type=water"><span class="quick-ic ic-blue"><span class="material-symbols-rounded">water_drop</span></span><span>물</span></a>
        <a class="quick-btn" href="record.html?type=poop"><span class="quick-ic ic-orange"><span class="material-symbols-rounded">pets</span></span><span>배변</span></a>
        <a class="quick-btn" href="record.html?type=weight"><span class="quick-ic ic-yellow"><span class="material-symbols-rounded">monitor_weight</span></span><span>체중</span></a>
        <a class="quick-btn" href="record.html?type=breath"><span class="quick-ic ic-green"><span class="material-symbols-rounded">air</span></span><span>호흡</span></a>
        <a class="quick-btn" href="record.html?type=photo"><span class="quick-ic ic-purple"><span class="material-symbols-rounded">photo_camera</span></span><span>사진</span></a>
        <button class="quick-btn" data-sheet-close><span class="quick-ic ic-orange"><span class="material-symbols-rounded">close</span></span><span>닫기</span></button>
      </div>
    </div>
  </div>

</div>
<script src="js/store.js?v=2"></script>
<script src="js/picker.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/register.js?v=2"></script>
</body>
</html>
