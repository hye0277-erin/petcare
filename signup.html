<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 회원가입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/signup.css" />
</head>
<body>
<div class="app">
  <div class="status-bar"><span>9:41</span>
    <span class="status-icons"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span>
  </div>

  <header class="sub-header">
    <a class="icon-btn" href="login.html" aria-label="뒤로"><span class="material-symbols-rounded">arrow_back_ios_new</span></a>
    <div class="title">회원가입</div>
    <span style="width:44px"></span>
  </header>

  <main class="scroll">
    <div class="section" data-rise>
      <div class="card">
        <div class="form">
          <div class="form-group">
            <span class="form-label">이름</span>
            <input class="input" id="su-name" type="text" placeholder="이름을 입력하세요" />
          </div>
          <div class="form-group">
            <span class="form-label">이메일</span>
            <input class="input" id="su-email" type="email" placeholder="example@email.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <span class="form-label">비밀번호</span>
            <input class="input" id="su-pw" type="password" placeholder="6자 이상 입력하세요" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <span class="form-label">비밀번호 확인</span>
            <input class="input" id="su-pw2" type="password" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" />
          </div>
        </div>
      </div>
    </div>

    <!-- 약관 동의 -->
    <div class="card-label" data-rise>약관 동의</div>
    <div class="card" data-rise>
      <div class="term-all" id="term-all">
        <span class="term-check" id="chk-all"><span class="material-symbols-rounded">check</span></span>
        <span class="term-all-txt">전체 동의하기</span>
      </div>
      <div class="terms-list">
        <label class="term-item">
          <span class="term-check" data-term data-required="1"><span class="material-symbols-rounded">check</span></span>
          <span class="term-txt">이용약관 동의</span><span class="term-req">[필수]</span>
        </label>
        <label class="term-item">
          <span class="term-check" data-term data-required="1"><span class="material-symbols-rounded">check</span></span>
          <span class="term-txt">개인정보 수집·이용 동의</span><span class="term-req">[필수]</span>
        </label>
        <label class="term-item">
          <span class="term-check" data-term data-required="1"><span class="material-symbols-rounded">check</span></span>
          <span class="term-txt">반려동물 건강 정보 제공 동의</span><span class="term-req">[필수]</span>
        </label>
        <label class="term-item">
          <span class="term-check" data-term><span class="material-symbols-rounded">check</span></span>
          <span class="term-txt">마케팅 정보 수신 동의</span><span class="term-opt">[선택]</span>
        </label>
      </div>
    </div>

    <div class="alert alert-error" id="su-error" style="display:none;margin:0 var(--space-page)"></div>
    <div class="alert alert-info" id="su-info" style="display:none;margin:0 var(--space-page)"></div>

    <div class="section" data-rise>
      <button class="btn btn-primary btn-block" id="su-submit" type="button">가입하기</button>
      <div style="text-align:center;font-size:13px;color:var(--color-text-sub);margin-top:14px">
        이미 계정이 있으신가요? <a href="login.html" style="color:var(--color-primary);font-weight:700">로그인</a>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/signup.js"></script>
</body>
</html>
