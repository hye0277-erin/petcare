<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PetCare+ · 병원 기록 상세</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" />
<script src="js/font-loader.js?v=2"></script>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/picker.css?v=2" />
<link rel="stylesheet" href="css/page-v2.css?v=2" />
<link rel="stylesheet" href="css/hospital.css?v=2" />
<script type="module" src="js/guard.js?v=2"></script>
</head>
<body>
<div class="app">

  <header class="pv2-header">
    <div class="pv2-header-nav">
      <button class="pv2-icon-btn" id="btn-back" aria-label="뒤로 가기">
        <span class="material-symbols-rounded">arrow_back_ios_new</span>
      </button>
      <div class="pv2-nav-title">병원 기록</div>
    </div>
    <div class="pv2-header-actions">
      <button class="pv2-icon-btn" id="btn-more" aria-label="더보기">
        <span class="material-symbols-rounded">more_vert</span>
      </button>
    </div>
  </header>

  <main class="scroll hosp-detail-scroll">
    <div id="detail-body"></div>
    <div class="hosp-page-bottom"></div>
  </main>

  <!-- 더보기 메뉴 -->
  <div class="sheet-overlay" id="more-sheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="hosp-menu-list">
        <button class="hosp-menu-item" id="btn-edit">
          <span class="material-symbols-rounded">edit</span> 기록 수정
        </button>
        <button class="hosp-menu-item" id="btn-share">
          <span class="material-symbols-rounded">share</span> 공유 준비하기
        </button>
        <button class="hosp-menu-item danger" id="btn-delete">
          <span class="material-symbols-rounded">delete</span> 기록 삭제
        </button>
      </div>
    </div>
  </div>

  <!-- 첨부파일 교체/추가용 hidden input -->
  <input type="file" id="file-replace-input" accept="application/pdf,image/png,image/jpeg" class="hosp-hidden-input" />

  <!-- 이미지 미리보기 모달 -->
  <div id="img-preview-modal" class="hosp-img-modal" onclick="if(event.target===this)this.style.display='none'">
    <img id="img-preview-img" src="" alt="미리보기" class="hosp-img-preview" />
    <div class="hosp-img-modal-btns">
      <button onclick="document.getElementById('img-preview-modal').style.display='none'" class="hosp-img-btn">닫기</button>
      <button id="img-preview-dl" class="hosp-img-btn primary">다운로드</button>
    </div>
  </div>

</div>
<script src="js/store.js?v=2"></script>
<script src="js/picker.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/hospital-detail.js?v=1"></script>
</body>
</html>
